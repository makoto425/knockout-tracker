name: Update knockout tracker

on:
  schedule:
    # GitHub Actions 的 schedule 事件常常會延遲;實測 9/26-9/30 這五天
    # 排在 00:17 UTC 仍一路延遲到 04:58-05:43 UTC 才真正執行(延遲約 4h41m-5h26m,
    # 平均約 5h06m)。這裡改成提前排程做補償,目標是讓「實際執行」落在
    # 00:00 UTC 附近(= 北京時間早上 8 點),而不是把「排定時間」設在 8 點。
    # 若延遲幅度之後改變,可能需要重新調整這個時間。
    - cron: "54 18 * * *"  # 預計延遲後約 23:55-00:20 UTC 執行 ≈ 北京時間 07:55-08:20
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and build site
        run: python scripts/gh_fetch_and_build.py

      - name: Commit data snapshot back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --quiet --cached || git commit -m "chore: update daily data snapshot"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
