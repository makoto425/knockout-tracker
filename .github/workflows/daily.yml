name: Update knockout tracker

on:
  schedule:
    # GitHub Actions 的 schedule 事件常常會延遲;實測 9/26-9/30 這五天
    # 排在 00:17 UTC 仍一路延遲到 04:58-05:43 UTC 才真正執行(延遲約 4h41m-5h26m,
    # 平均約 5h06m)。這裡改成提前排程做補償,目標是讓「實際執行」落在
    # 00:00 UTC 附近(= 北京時間早上 8 點),而不是把「排定時間」設在 8 點。
    # 若延遲幅度之後改變,可能需要重新調整這個時間。
    - cron: "54 18 * * *"  # 預計延遲後約 23:55-00:20 UTC 執行 ≈ 北京時間 07:55-08:20
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and build site
        run: python scripts/gh_fetch_and_build.py

      - name: Commit data snapshot back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --quiet --cached; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily data snapshot"

          # push 可能因為 base 落後(例如有人手動 re-run 舊的 run,或剛好兩個 run
          # 重疊)被拒絕。失敗時 fetch + rebase 到最新 origin/master 再重試幾次,
          # 真的解不開衝突也不讓整個 job 失敗 —— 這次 build 出來的 site/ 一樣會
          # 照常部署,只是這天的 data snapshot commit 沒推上去而已。
          attempt=1
          max_attempts=5
          while true; do
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::git push failed after $attempt attempts; leaving today's data snapshot commit unpushed (site will still deploy from this run's local build)."
              break
            fi
            wait_s=$(( RANDOM % 10 + attempt * 5 ))
            echo "Push rejected (attempt $attempt/$max_attempts). Retrying in ${wait_s}s after fetch+rebase..."
            sleep "$wait_s"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort
              echo "::warning::Rebase conflict against origin/master (likely another run already updated the same snapshot) — skipping this run's data commit."
              break
            fi
            attempt=$((attempt + 1))
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
